<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Local Wispr hero image</title>
  <desc id="desc">A matte macOS-style dictation overlay with animated-style waveform bars above the Local Wispr wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#16191f"/>
      <stop offset="0.58" stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#1d2330"/>
    </linearGradient>
    <radialGradient id="wash" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#4f8cff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#252a33"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#4f8cff" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="44" fill="url(#wash)"/>
  <g opacity="0.42">
    <circle cx="206" cy="120" r="1.4" fill="#fff"/>
    <circle cx="956" cy="104" r="1.1" fill="#fff"/>
    <circle cx="1012" cy="448" r="1.3" fill="#fff"/>
    <circle cx="246" cy="470" r="1" fill="#fff"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="471" y="120" width="258" height="112" rx="56" fill="url(#pill)" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="500" y="141" width="198" height="1.5" rx="1" fill="#fff" opacity="0.10"/>
    <g fill="#f5f7fb">
      <rect x="536" y="170" width="10" height="32" rx="5" opacity="0.72"/>
      <rect x="560" y="154" width="10" height="64" rx="5" opacity="0.92"/>
      <rect x="584" y="164" width="10" height="44" rx="5" opacity="0.80"/>
      <rect x="608" y="146" width="10" height="78" rx="5" opacity="0.98"/>
      <rect x="632" y="158" width="10" height="56" rx="5" opacity="0.86"/>
      <rect x="656" y="172" width="10" height="28" rx="5" opacity="0.68"/>
    </g>
  </g>
  <text x="600" y="356" text-anchor="middle" fill="#f7f7f8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">Local Wispr</text>
  <text x="600" y="415" text-anchor="middle" fill="#b6bdc9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="28" font-weight="500">private, local-first dictation for macOS</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="20" font-weight="600" fill="#d8dde7">
    <rect x="318" y="475" width="162" height="44" rx="22" fill="#ffffff" opacity="0.07"/>
    <text x="399" y="504" text-anchor="middle">Moonshine STT</text>
    <rect x="504" y="475" width="192" height="44" rx="22" fill="#ffffff" opacity="0.07"/>
    <text x="600" y="504" text-anchor="middle">no cloud account</text>
    <rect x="720" y="475" width="162" height="44" rx="22" fill="#ffffff" opacity="0.07"/>
    <text x="801" y="504" text-anchor="middle">hold to talk</text>
  </g>
</svg>
