<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Local Wispr settings mockup</title>
  <desc id="desc">A macOS-style settings window showing permissions and local engine status.</desc>
  <defs>
    <linearGradient id="window" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#e9ebef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="720" height="460" rx="28" fill="#151920"/>
  <g filter="url(#shadow)">
    <rect x="92" y="58" width="536" height="344" rx="18" fill="url(#window)"/>
    <rect x="92" y="58" width="536" height="42" rx="18" fill="#ffffff" opacity="0.72"/>
    <circle cx="119" cy="80" r="6" fill="#ff5f57"/>
    <circle cx="139" cy="80" r="6" fill="#ffbd2e"/>
    <circle cx="159" cy="80" r="6" fill="#28c840"/>
    <text x="360" y="86" text-anchor="middle" fill="#39404a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="13" font-weight="600">Local Wispr</text>
    <text x="130" y="139" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="28" font-weight="700">Settings</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif">
      <rect x="130" y="164" width="460" height="58" rx="14" fill="#fff" opacity="0.76"/>
      <circle cx="160" cy="193" r="13" fill="#2f7df6" opacity="0.14"/>
      <text x="187" y="189" fill="#1f2937" font-size="15" font-weight="650">Microphone</text>
      <text x="187" y="207" fill="#6b7280" font-size="12">Required for local dictation</text>
      <text x="542" y="198" text-anchor="end" fill="#15803d" font-size="13" font-weight="650">Allowed</text>
      <rect x="130" y="234" width="460" height="58" rx="14" fill="#fff" opacity="0.76"/>
      <circle cx="160" cy="263" r="13" fill="#2f7df6" opacity="0.14"/>
      <text x="187" y="259" fill="#1f2937" font-size="15" font-weight="650">Paste Helper</text>
      <text x="187" y="277" fill="#6b7280" font-size="12">Stable Accessibility trust for rebuilds</text>
      <text x="542" y="268" text-anchor="end" fill="#15803d" font-size="13" font-weight="650">Ready</text>
      <rect x="130" y="304" width="460" height="58" rx="14" fill="#fff" opacity="0.76"/>
      <circle cx="160" cy="333" r="13" fill="#2f7df6" opacity="0.14"/>
      <text x="187" y="329" fill="#1f2937" font-size="15" font-weight="650">Moonshine Native</text>
      <text x="187" y="347" fill="#6b7280" font-size="12">Local streaming speech-to-text</text>
      <text x="542" y="338" text-anchor="end" fill="#1d4ed8" font-size="13" font-weight="650">Installed</text>
    </g>
  </g>
</svg>
